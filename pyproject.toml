[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eth-mev"
version = "0.1.0"
description = "Ethereum sandwich-exposure measurement and replay (thesis research)"
requires-python = ">=3.12"
dependencies = [
    "web3>=7",
    "aiohttp>=3",
    "eth-account>=0.13",
    "eth-abi>=5",
    "hexbytes>=1",
    "duckdb>=1",
    "pyarrow>=15",
    "pandas>=2",
    "numpy>=1.26",
    "lightgbm>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
figures = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["eth_mev*"]

[tool.setuptools.package-data]
eth_mev = ["app/dashboard/page/**/*", "strategy/execution/arb/contract/*.sol"]

[tool.pytest.ini_options]
testpaths = ["scripts/checks"]
pythonpath = ["."]
